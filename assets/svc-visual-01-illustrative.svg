<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative operations overview</title>
  <desc id="desc">A sample operating view for priorities, ownership, deadlines and follow-up without historical metrics.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6e6250" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.label{font-size:18px;font-weight:700;letter-spacing:3px;fill:#827b70}.title{font-size:34px;fill:#211e1a}.body{font-size:21px;fill:#3f3b35}.small{font-size:17px;fill:#716b61}.tag{font-size:17px;font-weight:700;fill:#bb532f}.state{font-size:15px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="700" rx="26" fill="#f2e8d6"/>
  <g filter="url(#shadow)">
    <rect x="30" y="28" width="450" height="644" rx="28" fill="#fff"/>
    <rect x="510" y="28" width="450" height="644" rx="28" fill="#fff"/>
    <rect x="1090" y="28" width="480" height="644" rx="28" fill="#fff"/>
  </g>

  <g class="sans">
    <text class="label" x="72" y="82">OPERATIONS OVERVIEW</text>
    <text class="serif title" x="72" y="135">Priorities and ownership</text>
    <circle cx="255" cy="285" r="104" fill="none" stroke="#eee7dc" stroke-width="28"/>
    <path d="M255 181a104 104 0 0 1 89 158" fill="none" stroke="#c35d37" stroke-width="28" stroke-linecap="round"/>
    <path d="M344 339a104 104 0 0 1-164 24" fill="none" stroke="#d0aa34" stroke-width="28" stroke-linecap="round"/>
    <circle cx="255" cy="285" r="45" fill="#f7f3eb"/>
    <path d="M232 286l15 15 32-36" fill="none" stroke="#4c7b58" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="442" width="14" height="14" rx="3" fill="#c35d37"/><text class="body" x="104" y="457">Needs attention</text><text class="state" x="382" y="456" text-anchor="end" fill="#c35d37">REVIEW</text>
    <rect x="74" y="496" width="14" height="14" rx="3" fill="#d0aa34"/><text class="body" x="104" y="511">Waiting for input</text><text class="state" x="382" y="510" text-anchor="end" fill="#9e7b16">WAITING</text>
    <rect x="74" y="550" width="14" height="14" rx="3" fill="#211e1a"/><text class="body" x="104" y="565">Ready to complete</text><text class="state" x="382" y="564" text-anchor="end" fill="#4c7b58">READY</text>

    <text class="label" x="552" y="82">DAILY BRIEF</text>
    <rect x="552" y="112" width="58" height="58" rx="16" fill="#e56a3d"/>
    <path d="M581 126l4 14 14 4-14 4-4 14-4-14-14-4 14-4z" fill="#fff"/>
    <text class="serif title" x="552" y="218">Keep priorities moving</text>
    <rect x="552" y="252" width="366" height="104" rx="18" fill="#fbfaf7" stroke="#ddd7ce" stroke-width="2"/>
    <text class="body" x="575" y="286">Board preparation, service-provider</text>
    <text class="body" x="575" y="316">renewals, invoices, meetings</text>
    <text class="body" x="575" y="346">and follow-up</text>
    <line x1="552" y1="398" x2="918" y2="398" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="552" y="438">Align calendars</text><rect x="830" y="416" width="88" height="34" rx="17" fill="#f5e3dc"/><text class="state" x="874" y="439" text-anchor="middle" fill="#bb532f">OPEN</text>
    <line x1="552" y1="470" x2="918" y2="470" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="552" y="510">Track commitments</text><rect x="818" y="488" width="100" height="34" rx="17" fill="#f6ecd0"/><text class="state" x="868" y="511" text-anchor="middle" fill="#8b6e18">WAIT</text>
    <line x1="552" y1="542" x2="918" y2="542" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="552" y="582">Follow up owners</text><rect x="828" y="560" width="90" height="34" rx="17" fill="#e5efe7"/><text class="state" x="873" y="583" text-anchor="middle" fill="#477252">NEXT</text>

    <text class="label" x="1132" y="82">PRIORITY CONTROL</text>
    <circle cx="1170" cy="148" r="30" fill="#c35d37"/>
    <path d="M1158 145h24v20h-24zm5-10h14v10h-14z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text class="serif title" x="1218" y="139">Operational</text>
    <text class="serif title" x="1218" y="174">follow-through</text>
    <text class="small" x="1218" y="202">Illustrative example</text>
    <circle cx="1160" cy="270" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1151 270l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1190" y="278">Owner confirmed</text>
    <circle cx="1160" cy="330" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1151 330l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1190" y="338">Next action clear</text>
    <circle cx="1160" cy="390" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1151 390l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1190" y="398">Deadline visible</text>
    <rect x="1132" y="472" width="118" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1191" y="500" text-anchor="middle">Executive</text>
    <rect x="1264" y="472" width="128" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1328" y="500" text-anchor="middle">Operations</text>
    <rect x="1406" y="472" width="106" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1459" y="500" text-anchor="middle">Finance</text>
  </g>
</svg>
