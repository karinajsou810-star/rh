<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative workforce overview</title>
  <desc id="desc">A sample operating view for team coverage, responsibilities and follow-up without historical metrics or personal names.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#6e6250" flood-opacity=".12"/></filter>
    <style>
      .sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.label{font-size:18px;font-weight:700;letter-spacing:3px;fill:#827b70}.title{font-size:34px;fill:#211e1a}.body{font-size:21px;fill:#3f3b35}.small{font-size:17px;fill:#716b61}.tag{font-size:17px;font-weight:700;fill:#bb532f}.state{font-size:15px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1600" height="700" rx="26" fill="#f2e8d6"/>
  <g filter="url(#shadow)">
    <rect x="30" y="28" width="430" height="644" rx="28" fill="#fff"/>
    <rect x="490" y="28" width="430" height="644" rx="28" fill="#fff"/>
    <rect x="1050" y="28" width="520" height="644" rx="28" fill="#fff"/>
  </g>

  <g class="sans">
    <text class="label" x="72" y="82">TEAM COVERAGE</text>
    <text class="serif title" x="72" y="135">Coverage planning</text>
    <circle cx="245" cy="282" r="104" fill="none" stroke="#eee7dc" stroke-width="28"/>
    <path d="M245 178a104 104 0 0 1 92 153" fill="none" stroke="#c35d37" stroke-width="28" stroke-linecap="round"/>
    <path d="M337 331a104 104 0 0 1-170 23" fill="none" stroke="#d0aa34" stroke-width="28" stroke-linecap="round"/>
    <circle cx="245" cy="282" r="45" fill="#f7f3eb"/>
    <path d="M218 294c6-22 47-22 54 0M245 258a15 15 0 1 0 0-30 15 15 0 0 0 0 30z" fill="none" stroke="#4c7b58" stroke-width="7" stroke-linecap="round"/>
    <rect x="72" y="438" width="14" height="14" rx="3" fill="#4c7b58"/><text class="body" x="102" y="453">Covered</text><text class="state" x="390" y="452" text-anchor="end" fill="#4c7b58">CONFIRMED</text>
    <rect x="72" y="492" width="14" height="14" rx="3" fill="#d0aa34"/><text class="body" x="102" y="507">Needs coverage</text><text class="state" x="390" y="506" text-anchor="end" fill="#9e7b16">ACTION</text>
    <rect x="72" y="546" width="14" height="14" rx="3" fill="#211e1a"/><text class="body" x="102" y="561">Unavailable</text><text class="state" x="390" y="560" text-anchor="end" fill="#5f5951">NOTED</text>

    <text class="label" x="532" y="82">WEEKLY PULSE</text>
    <rect x="532" y="112" width="58" height="58" rx="16" fill="#e56a3d"/>
    <path d="M547 130h28v20h-16l-8 8v-8h-4z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <text class="serif title" x="532" y="218">Keep the team aligned</text>
    <rect x="532" y="252" width="346" height="104" rx="18" fill="#fbfaf7" stroke="#ddd7ce" stroke-width="2"/>
    <text class="body" x="555" y="288">Coverage gaps, backup owners</text>
    <text class="body" x="555" y="318">and this week's priorities</text>
    <line x1="532" y1="398" x2="878" y2="398" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="532" y="438">Confirm coverage</text><rect x="790" y="416" width="88" height="34" rx="17" fill="#e5efe7"/><text class="state" x="834" y="439" text-anchor="middle" fill="#477252">READY</text>
    <line x1="532" y1="470" x2="878" y2="470" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="532" y="510">Notify managers</text><rect x="778" y="488" width="100" height="34" rx="17" fill="#f6ecd0"/><text class="state" x="828" y="511" text-anchor="middle" fill="#8b6e18">NEXT</text>
    <line x1="532" y1="542" x2="878" y2="542" stroke="#ded8ce" stroke-width="2"/>
    <text class="body" x="532" y="582">Schedule check-ins</text><rect x="790" y="560" width="88" height="34" rx="17" fill="#f5e3dc"/><text class="state" x="834" y="583" text-anchor="middle" fill="#bb532f">OPEN</text>

    <text class="label" x="1092" y="82">TEAM STATUS</text>
    <circle cx="1132" cy="148" r="34" fill="#d0aa34"/>
    <path d="M1111 160c6-24 36-24 42 0M1132 137a14 14 0 1 0 0-28 14 14 0 0 0 0 28z" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text class="serif title" x="1184" y="146">Coverage coordinator</text>
    <text class="small" x="1184" y="177">Illustrative role</text>
    <circle cx="1120" cy="270" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1111 270l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1150" y="278">Check-ins completed</text>
    <circle cx="1120" cy="330" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1111 330l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1150" y="338">Coverage confirmed</text>
    <circle cx="1120" cy="390" r="17" fill="none" stroke="#4c7b58" stroke-width="3"/><path d="M1111 390l6 6 12-14" fill="none" stroke="#4c7b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="body" x="1150" y="398">Follow-up logged</text>
    <rect x="1092" y="472" width="132" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1158" y="500" text-anchor="middle">Onboarding</text>
    <rect x="1238" y="472" width="128" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1302" y="500" text-anchor="middle">Scheduling</text>
    <rect x="1092" y="534" width="204" height="44" rx="22" fill="#fff" stroke="#ddd7ce" stroke-width="2"/><text class="tag" x="1194" y="562" text-anchor="middle">Team coordination</text>
  </g>
</svg>
